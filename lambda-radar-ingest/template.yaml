AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Archives NEA 240km rain radar frames to S3 every 5 minutes.

Parameters:
  NeaApiKey:
    Type: String
    NoEcho: true
    Description: data.gov.sg API key (create at https://data.gov.sg/signin -> Create API Key)
  RadarRange:
    Type: String
    Default: 240km
    Description: NEA radar coverage range to fetch
  RadarBucketName:
    Type: String
    Default: dryroute-rain-radar
    Description: >
      Name of an existing S3 bucket to write radar frames into. This bucket is
      NOT managed by this stack (not created or deleted by it) - it must
      already exist.

Globals:
  Function:
    Timeout: 30
    MemorySize: 256

Resources:
  RadarIngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Architectures:
        - arm64
      Environment:
        Variables:
          RADAR_BUCKET_NAME: !Ref RadarBucketName
          NEA_API_KEY: !Ref NeaApiKey
          RADAR_RANGE: !Ref RadarRange
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
              Resource: !Sub "arn:aws:s3:::${RadarBucketName}/*"
            - Effect: Allow
              Action:
                - s3:ListBucket
              Resource: !Sub "arn:aws:s3:::${RadarBucketName}"
      Events:
        ScheduleEvent:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: ./
      DockerTag: latest

  RadarBucketPublicReadPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref RadarBucketName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadRadarFrames
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${RadarBucketName}/*"

Outputs:
  RadarBucketName:
    Value: !Ref RadarBucketName
  RadarIngestFunctionArn:
    Value: !GetAtt RadarIngestFunction.Arn
