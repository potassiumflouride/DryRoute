[project]
name = "radar-ingest"
version = "0.1.0"
description = "Lambda that archives NEA rain radar frames to S3 every 5 minutes"
readme = "README.md"
authors = [
    { name = "potassiumflouride", email = "potassiumflouride@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.36.0",
    "httpx>=0.28.1",
]

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "moto[s3]>=5.0.0",
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.16.3",
]
