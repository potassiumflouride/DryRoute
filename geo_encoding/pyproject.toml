[project]
name = "geo-encoding-gateway"
version = "0.1.0"
description = "Authenticating, rate-limited proxy gateway in front of OneMap Singapore's API"
readme = "README.md"
authors = [
    { name = "potassiumflouride", email = "potassiumflouride@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.16.3",
]
