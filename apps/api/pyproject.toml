[project]
name = "dryroute-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "potassiumflouride", email = "potassiumflouride@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "numpy>=2.5.2",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "pyproj>=3.7.2",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
