[project]
name = "dryroute-load-tests"
version = "0.1.0"
description = "Self-contained load testing suite for DryRoute services"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1,<0.29",
    "python-dotenv>=1.1.1,<2",
]

[project.scripts]
dryroute-load = "loadtest.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0,<10",
    "pytest-asyncio>=1.3,<2",
    "ruff>=0.16,<0.17",
]

[build-system]
requires = ["uv_build>=0.11.1,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "loadtest"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
